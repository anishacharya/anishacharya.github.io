# Single source of truth for all publications.
# Reconciled against ~/Desktop/portfolio/CV_ANISH/publication.tex (the active CV).
#
# Views over this file: /publications (all, reverse-chronological), the
# homepage Selected Work section, the /research threads (papers are placed by
# key in research.html), and one page per paper at /papers/<key>/.
#
# Paper pages: every entry with a `summary` gets a page. After adding or
# editing entries, regenerate the stubs:
#     python3 scripts/gen_paper_pages.py
#
# Fields:
#   key         unique slug; also the paper page URL
#   title       full title
#   summary     one plain-language sentence or two stating the result
#   authors     list; write "A Acharya" for yourself so templates render the
#               full name and emphasize it
#   authors_full  optional full author list, used instead of `authors`
#   venue       short venue
#   venue_full  spelled-out venue
#   year        integer, used for grouping
#   type        conference | journal | workshop | preprint
#   selected    true to show in the homepage Selected Work section
#   note        long qualifier (for workshops, the workshop name); note_short
#               is the short version
#   links       label -> url (empty strings are skipped at render time)
#   also        earlier or extended versions
#   thrusts, thumb   legacy fields from an earlier design; not rendered
# ─────────────────────────── 2026 ───────────────────────────

- key: splice
  title: "SPLICE: Structured Prompt Local Iterative Combinatorial Evolution"
  summary: "Treats a production prompt as a set of blocks, some frozen and some editable, and optimizes it with section-local textual gradients and elitist beam search, giving the first formal guarantees for iterative LLM-driven prompt optimization. Outperforms prior prompt optimizers across benchmarks and three model capability tiers while keeping frozen sections verbatim."
  authors: [A Acharya, P Studans, A Dhanda, N V Rao, V A Khatri, S A Niaki, B Verkhovsky]
  venue: NeurIPS 2026
  venue_full: Conference on Neural Information Processing Systems (NeurIPS)
  year: 2026
  type: conference

- key: ropoll
  title: "RoPoLL: Robust Panel of LLM Judges"
  summary: "Shows that averaging an LLM jury is unboundedly biased once any judge fails systematically, and replaces the average with a geometric-median aggregator that has the optimal 1/2 breakdown point. A 3-judge 38B panel beats a 675B judge by 1.31x under 30% corruption."
  authors: [A Acharya, K Pan, B Verkhovsky]
  venue: ICML 2026
  venue_full: International Conference on Machine Learning (ICML)
  year: 2026
  type: workshop
  thrusts: [robust]
  selected: true
  note: Workshop on Statistical Frameworks for Uncertainty in Agentic Systems (AgenticUQ)
  note_short: AgenticUQ Workshop
  links:
    OpenReview: "https://openreview.net/pdf?id=Rvj0jSb86u"
    arXiv: "https://arxiv.org/abs/2606.30931"
    Amazon Science: "https://www.amazon.science/publications/ropoll-robust-panel-of-llm-judges"

