# --- Site ---------------------------------------------------------------- #
#
# To switch which version of the site is live, edit _data/version.yml.
# Nothing in this file needs to change for that.

url: "https://anishacharya.github.io"
baseurl: ""

title: Anish Acharya, PhD
description: "Research scientist at AWS. Post-training, recursive self improvement, and multi-agent systems."

author:
  name: Anish Acharya

social:
  email: "anishacharya@utexas.edu"
  github: anishacharya
  linkedin: anish-acharya-a98a9383
  scholar: uBmgGMAAAAAJ

# --- Navigation ---------------------------------------------------------- #

nav:
  Research: "/research/"
  Publications: "/publications/"
  Talks: "/talks/"

# --- Build --------------------------------------------------------------- #

# No dates in URLs: /papers/ still reads well in 2050.
permalink: /:title/

markdown: kramdown
kramdown:
  input: GFM
timezone: "America/Chicago"

plugins:
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      layout: "page"
  # Keep the archived site reachable by direct URL but out of search results:
  # noindex is set in each legacy page's <head>, and this drops the whole
  # legacy/ tree from sitemap.xml so we never advertise noindex URLs.
  - scope:
      path: "legacy"
    values:
      sitemap: false

# legacy/ is pre-rendered static HTML — copy it through untouched.
include:
  - legacy
keep_files:
  - legacy

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
