# Venues carry full name + parenthesised abbreviation, matching 07-CV/service.tex and the venue lines
# on /publications. Abbreviations alone assume the reader already knows the field; this section is often
# read by someone who does not.
#
# Two deliberate non-abbreviations: Pattern Recognition Letters stays spelled out because "PRL" reads
# universally as Physical Review Letters, and Cognitive Neurodynamics / Discover Electronics have no
# established initialism, so none is invented.
service:
  - label: "Reviewer, Conferences"
    items: ["International Conference on Machine Learning (ICML)",
            "Conference on Neural Information Processing Systems (NeurIPS)",
            "International Conference on Learning Representations (ICLR)",
            "International Conference on Artificial Intelligence and Statistics (AISTATS)",
            "Conference on Uncertainty in Artificial Intelligence (UAI)",
            "Annual Meeting of the Association for Computational Linguistics (ACL)",
            "IEEE International Symposium on Information Theory (ISIT)"]
  - label: "Reviewer, Journals"
    # One rule: journal name, publisher in parentheses, every entry. No journal abbreviations, so the
    # parenthetical means exactly one thing. (The conference line parenthesises abbreviations instead —
    # conferences are cited by acronym and have no publisher; journals are cited by full name.)
    #
    # "Springer Nature", never "Nature": both Springer titles are portfolio journals, not Nature
    # Portfolio, so "Nature" would misread as a Nature-branded venue.
    #
    # NOTE on JMLR: MIT Press published volumes 1–4 (2000–2004); Microtome Publishing / JMLR, Inc. has
    # published it since 2005, so Microtome is the accurate publisher for recent reviewing. "MIT Press"
    # is set at the author's explicit direction — do not silently change it in either direction.
    items: ["Journal of Machine Learning Research (MIT Press)",
            "Transactions on Knowledge and Data Engineering (IEEE)",
            "Pattern Recognition Letters (Elsevier)",
            "Cognitive Neurodynamics (Springer Nature)",
            "Discover Electronics (Springer Nature)"]
  - label: "Program Committee"
    items: ["International Conference on Machine Learning (ICML)",
            "AAAI Conference on Artificial Intelligence (AAAI)"]

