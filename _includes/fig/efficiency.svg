<svg viewBox="0 0 320 108" role="img" aria-label="A full parameter matrix approximated by the product of two thin low-rank factors, giving a much smaller footprint.">
  <rect class="bx" x="22" y="24" width="64" height="64" rx="2"/>
  <text class="lb sm" x="54" y="102" text-anchor="middle">d × n</text>
  <text class="op" x="104" y="61" text-anchor="middle">≈</text>
  <rect class="s2-fill" x="126" y="24" width="16" height="64" rx="2"/>
  <text class="s2-t sm" x="134" y="102" text-anchor="middle">d × k</text>
  <text class="op" x="160" y="61" text-anchor="middle">×</text>
  <rect class="s2-fill" x="176" y="48" width="64" height="16" rx="2"/>
  <text class="s2-t sm" x="208" y="102" text-anchor="middle">k × n</text>
  <text class="lb sm" x="304" y="52" text-anchor="end">k ≪ d</text>
  <text class="lb sm" x="304" y="68" text-anchor="end">~90% smaller</text>
</svg>
