# Research threads: homepage cards, in this order, each linking to its own page
# at `page` (research/<slug>.html, layout: thread). `id` ties a page to its
# entry here via the page's `thread:` front matter. The first thread renders
# full-width as the lead.
#
# Search fields, none of them shown on the page:
#   seo_title  the thread page's <title>, phrased the way people search for the
#              topic (base.html appends the site name)
#   keywords   search phrases for the thread, emitted as schema.org `keywords`
#   about      the topic's Wikipedia article and Wikidata item, emitted as
#              schema.org `about` so search engines tie the page, and through
#              it the person, to that topic entity. Check each ID resolves
#              (en.wikipedia.org/api/rest_v1/page/summary/<title>) before adding.

- id: thread-rsi
  page: /research/recursive-self-improvement/
  title: "Recursive Self Improvement"
  role: "Complete adaptation loop"
  blurb: "Learning systems that adapt their weights, prompts, tools, and coordination while staying faithful to the intended objective, even when the reward model they optimize can be exploited."
  seo_title: "Recursive Self-Improvement of AI Agents"
  keywords: ["recursive self-improvement", "self-improving AI agents", "self-improving LLM agents", "reward modeling", "reward hacking", "LLM-as-a-judge", "LLM evaluation", "prompt optimization", "post-training", "validation-gated search", "multi-agent systems"]
