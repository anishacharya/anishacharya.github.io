- key: gm-matching
  title: Geometric Median Matching for Robust k-Subset Selection from Noisy Data
  summary: "Selects a k-subset whose mean tracks the geometric median of noisy data, giving an O(1/k) rate under arbitrary corruption, a quadratic improvement over random sampling."
