# --- Site ---------------------------------------------------------------- #
#
# To switch which version of the site is live, edit _data/version.yml.
# Nothing in this file needs to change for that.

url: "https://anishacharya.github.io"
baseurl: ""

title: Anish Acharya, PhD
description: "Research scientist at AWS. Multi-agent systems, robust and efficient learning."

author:
  name: Anish Acharya

social:
  email: "anishacharya@utexas.edu"
  github: anishacharya
  linkedin: anish-acharya-a98a9383
  scholar: uBmgGMAAAAAJ

# --- Navigation ---------------------------------------------------------- #

nav:
  Research: "/research/"
  Papers: "/papers/"
  Talks: "/talks/"
  CV: "/cv/"
  Photos: "/photos/"

# --- Build --------------------------------------------------------------- #

# No dates in URLs: /papers/ still reads well in 2050.
permalink: /:title/

markdown: kramdown
kramdown:
  input: GFM
timezone: "America/Chicago"

plugins:
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      layout: "page"

# legacy/ is pre-rendered static HTML — copy it through untouched.
include:
  - legacy
keep_files:
  - legacy

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
