# Collaborators: coauthors, co-inventors, advisors, thesis committee, and
# internship hosts. Rendered at /collaborators/ (linked from the footer, not the
# nav), and used by _includes/authors.html to link coauthor names in paper and
# patent author lists to Google Scholar.
#
# Fields:
#   name     full name as published (arXiv, ACL Anthology, Crossref, Amazon
#            Science); never expand an initial from memory
#   scholar  Google Scholar user id. Only ids confirmed on the paper's own
#            Scholar entry or on the owner's Scholar co-author list. Leave it out
#            rather than guess; a wrong id links to a stranger.
#   as       spellings used in papers.yml `authors` / patents.yml `inventors`
#   papers   shared paper and patent keys. Where two coauthors of one paper
#            share a spelling ("S Das" twice), write key@N, N being the 1-based
#            position in that paper's author list.
#   role     advisor | committee | host (optional; shown on the page)
#   group    key into `groups`

groups:
  - key: aws
    title: Amazon Web Services
  - key: ut
    title: UT Austin (PhD)
  - key: meta
    title: Meta
  - key: msr
    title: Microsoft Research
  - key: alexa
    title: Amazon Alexa AI
  - key: nlp
    title: NLP datasets (LDKP, GupShup)
  - key: ttic
    title: Toyota Technological Institute at Chicago
  - key: ju
    title: Jadavpur University (undergraduate)

