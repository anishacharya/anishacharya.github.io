# Invited talks and presentations, strictly reverse chronological.
# Reconciled against CV_ANISH/talks.tex.
#
# Data contract:
#   topic      documented subject or exact presentation title
#   appearance truthful primary label only when no topic is documented
#   venue      event, conference, or hosting group; always rendered
#   location   city or delivery mode
#   type       presentation format or role
#   url        venue/event URL
#
# Every record requires venue, location, and type, plus either topic or
# appearance. Never infer a topic from the venue name.
#
# Note: the recurring AWS GenAI training sessions are an Instructor role and
# live in work.yml -> teaching, not here.

