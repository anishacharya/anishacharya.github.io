# Full chronological record, newest first. Compiled from CV_ANISH/*.tex.
#
# Rendered in the scrollable News box on the landing page. Keep `what` SHORT —
# one line, roughly 70 characters or less. Anything longer is clipped with an
# ellipsis (full text stays available as the link title).
#
# Fields: year (int), when (season, optional), what (short),
#         kind: milestone | paper | patent | launch | talk | award | role | press
#         links (optional) label -> url
#
# ALL links live in `links`. There is no `url` field any more: the row text is
# never itself a hyperlink. Before, a launch showed named links on the right, a
# paper buried its link under the row text, and a talk showed nothing at all —
# three treatments, and no way to see which rows had material attached without
# hovering every one. Now the right-hand column is the only place links appear,
# so the presence of material is visible at a glance.
#
# Label by what the reader gets, not by the row's kind: OpenReview, PMLR, arXiv,
# IEEE Xplore, ACL Anthology, ScienceDirect, Proceedings, Patent, Thesis, Docs,
# Blog, Product, Code, Video, Article, Thread, Announcement. Talk rows use
# `Paper` for the work presented and `Venue` for the event page — on a talk row
# the reader's question is "where is the work", so `Paper` beats naming the host.
#
# Put the canonical link first; other views take whichever comes first.
# Use `links` rather than inventing a row per link: the Research experience
# section is deliberately bare, so every launch link must be reachable from here,
# but "— docs" is not a news event.

