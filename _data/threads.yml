    - { name: "AI agent", wikipedia: "https://en.wikipedia.org/wiki/AI_agent", wikidata: "Q132451509" }
    - { name: "Multi-agent system", wikipedia: "https://en.wikipedia.org/wiki/Multi-agent_system", wikidata: "Q529909" }
    - { name: "Reward hacking", wikipedia: "https://en.wikipedia.org/wiki/Reward_hacking", wikidata: "Q123900749" }
