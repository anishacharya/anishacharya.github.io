{%- assign paper = include.paper -%}
{%- assign title = include.title | default: paper.title -%}
<li>
  <p class="thread-paper-title">
    {%- for link in paper.links limit:1 -%}
      <a href="{{ link[1] }}">{{ title }}</a>
    {%- endfor -%}
  </p>
  <p class="thread-paper-venue">
    {{ paper.venue }}{% if paper.note_short %} <span>· {{ paper.note_short }}</span>{% endif %}
  </p>
</li>
