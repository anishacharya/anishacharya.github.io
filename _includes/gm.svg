<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 190" role="img"
     aria-labelledby="gmtitle gmdesc">
  <title id="gmtitle">The mean breaks, the geometric median does not</title>
  <desc id="gmdesc">A cluster of inlier points. The geometric median stays inside the
  cluster while the mean is dragged away by a single distant outlier.</desc>

  <style>
    .pt   { fill: currentColor; opacity: 0.3; }
    .out  { fill: none; stroke: currentColor; stroke-width: 1.4; opacity: 0.7; }
    .lbl  { font: 500 10.5px system-ui, sans-serif; fill: currentColor; opacity: 0.55; }
    .mean { fill: none; stroke: #c2410c; stroke-width: 1.8; }
    .gm   { fill: #0f7a5a; }
    .drag { stroke: #c2410c; stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.55; fill: none; }
    .mlbl { font: 600 10.5px system-ui, sans-serif; fill: #c2410c; }
    .glbl { font: 600 10.5px system-ui, sans-serif; fill: #0f7a5a; }
  </style>

  <!-- inlier cluster -->
  <g class="pt">
    <circle cx="118" cy="84"  r="3"/><circle cx="136" cy="100" r="3"/>
    <circle cx="104" cy="108" r="3"/><circle cx="150" cy="82"  r="3"/>
    <circle cx="126" cy="118" r="3"/><circle cx="158" cy="108" r="3"/>
    <circle cx="112" cy="126" r="3"/><circle cx="142" cy="130" r="3"/>
    <circle cx="96"  cy="92"  r="3"/><circle cx="166" cy="94"  r="3"/>
    <circle cx="132" cy="68"  r="3"/><circle cx="150" cy="146" r="3"/>
    <circle cx="108" cy="68"  r="3"/><circle cx="170" cy="124" r="3"/>
    <circle cx="122" cy="96"  r="3"/><circle cx="146" cy="112" r="3"/>
  </g>

  <!-- geometric median: stays inside the cluster -->
  <circle class="gm" cx="134" cy="104" r="5"/>
  <text class="glbl" x="134" y="60" text-anchor="middle">geometric median</text>

  <!-- the single outlier -->
  <circle class="out" cx="412" cy="48" r="5.5"/>
  <text class="lbl" x="412" y="32" text-anchor="middle">one outlier</text>

  <!-- mean: dragged toward the outlier -->
  <path class="drag" d="M138 102 L 232 78"/>
  <circle class="mean" cx="238" cy="76" r="5"/>
  <text class="mlbl" x="250" y="80">mean</text>
</svg>
