<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="title">Accuracy per unit of resource</title>
<desc id="desc">Error against resource budget for two approaches: compressing a model afterward, and building the budget into the learning objective. Building it in gives lower error at the same budget, and the same error at a fraction of the budget. The budgets are data, communication, memory, and compute; the design choices are treating the budget as a constraint, selecting a representative subset, compressing representations, and allocating resources where the marginal gain is highest.</desc>
<style>
  /* Dark only, to match the site. Loaded as an image, so none of
     this reaches the page. Shared with rsi-loop.svg. */
  svg { --gr:#00FF77; --cy:#22D3EE; --mi:#7CFFB0; --am:#FFB020;
        --ink:#ecebe8; --mute:#9a9894; --node:#141413; --panel:#151514; --glow:.42; }
  .ink{fill:var(--ink)} .mute{fill:var(--mute)}
  .f-gr{fill:var(--gr)} .f-cy{fill:var(--cy)} .f-mi{fill:var(--mi)} .f-am{fill:var(--am)}
  .s-gr{stroke:var(--gr)} .s-cy{stroke:var(--cy)} .s-mi{stroke:var(--mi)} .s-am{stroke:var(--am)} .s-mute{stroke:var(--mute)}
  .st-gr{stop-color:var(--gr)} .st-cy{stop-color:var(--cy)} .st-mi{stop-color:var(--mi)} .st-am{stop-color:var(--am)}
  .node{fill:var(--node)} .panel{fill:var(--panel)} .bg{opacity:var(--glow)}
</style>
