# Research threads: homepage cards, in this order, each linking to its own page
# at `page` (research/<slug>.html, layout: thread). `id` ties a page to its
# entry here via the page's `thread:` front matter. The first thread renders
# full-width as the lead.

- id: thread-rsi
  page: /research/recursive-self-improvement/
  title: "Recursive Self Improvement"
  role: "Complete adaptation loop"
  blurb: "Learning systems that adapt their weights, prompts, tools, and coordination while staying faithful to the intended objective, even when the reward model they optimize can be exploited."

- id: thread-distributed
  page: /research/distributed-learning/
  title: "Distributed & Collaborative Learning"
  role: "Collective optimization and coordination"
  blurb: "How participants with different data, capabilities, and communication limits learn together, and stay stable under heterogeneity, failures, and adversaries."

- id: thread-robust
  page: /research/robust-learning/
  title: "Robust & Weakly Supervised Learning"
  role: "Inference from imperfect supervision"
  blurb: "What can be learned when supervision is corrupted, incomplete, indirect, or generated by another model."

- id: thread-efficiency
  page: /research/efficient-learning/
  title: "Efficient Learning"
  role: "Resource-constrained learning"
  blurb: "Data, communication, memory, and compute budgets treated as part of the learning problem rather than as post-processing."

- id: thread-foundations
  page: /research/control-and-stability/
  title: "Control & Stability"
  role: "Feedback and stability"
  blurb: "Adaptive learners as closed-loop dynamical systems: identification and stability when each update changes the data that comes next."
