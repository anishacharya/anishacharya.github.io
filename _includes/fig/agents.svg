<svg viewBox="0 0 320 108" role="img" aria-label="A closed loop: propose, score, keep, then back to propose. The scoring step is an estimate, and is the fragile link.">
  <defs>
    <marker id="ah" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 1 L7 4 L0 7 Z" fill="currentColor" opacity="0.5"/>
    </marker>
  </defs>
  <g class="ax"><rect x="6" y="26" width="80" height="32" rx="5"/><rect x="238" y="26" width="76" height="32" rx="5"/></g>
  <rect class="s1-stroke" x="122" y="26" width="76" height="32" rx="5"/>
  <text class="lb" x="46"  y="46" text-anchor="middle">propose</text>
  <text class="s1-t" x="160" y="46" text-anchor="middle">score</text>
  <text class="lb" x="276" y="46" text-anchor="middle">keep</text>
  <g class="ar"><path d="M88 42 H118" marker-end="url(#ah)"/><path d="M200 42 H234" marker-end="url(#ah)"/></g>
  <path class="ar-d" d="M276 60 V78 Q276 88 264 88 H58 Q46 88 46 78 V62" marker-end="url(#ah)"/>
  <text class="s1-t sm" x="160" y="20" text-anchor="middle">estimated — unbounded bias if naively aggregated</text>
</svg>
