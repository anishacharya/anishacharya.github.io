roles:
  - org: Amazon (AWS)
    title: Senior Research Scientist, AWS
    where: Austin, TX
    when: Spring 2025 –
    kind: Full Time
    tagline: Building Decentralized AI Marketplace
    note: >-
      Lead the full life-cycle of AWS multi-agent orchestration meshes —
      architecture, core research, production integration, and eval-driven
      iteration. Research on recursive self improvement: RoPoLL (robust reward
      modeling), SPLICE (prompt optimization), OrchOpt (orchestration search).

  - org: University of Texas at Austin
    title: Graduate Research Assistant
    where: Austin, TX
    when: Fall 2019 – Spring 2025
    kind: Part Time
    note: >-
      Doctoral research on robust, sample-efficient learning in high dimensions:
      robust estimation under label noise and Byzantine corruption, distributed
      and federated optimization, and data-efficient subset selection. Affiliated
      with the Institute for Foundations of Machine Learning (IFML).

  - org: Eidon AI
    title: Head of AI Research
    where: Austin, TX
    when: Summer 2024 – Winter 2025
    kind: Part Time
    tagline: The AI is the Blockchain, the Blockchain is the AI
    note: >-
      Architected and launched a multi-agent dynamic point-based system
      integrating blockchain with AI: evaluation metrics for content quality, AI
      alignment, and community standards, plus a tokenomics framework for reward
      distribution across the decentralized network.

  - org: Meta
    title: Research Scientist (Intern) / Student Researcher
    where: Menlo Park, CA
    when: Summer 2021 – Fall 2022
    hosts: [Li Jing, Bhargav Bhushanam, Dhruv Choudhary, Michael Rabbat]
    note: >-
      With Meta Capacity Engineering and Fundamental AI Research (FAIR): online,
      low-resource training to scale Facebook's deep recommendation models.
      Developed positive-unlabeled contrastive representation learning for weakly
      supervised click-through-rate prediction — learning from positives and
      unlabeled data without negative sampling.

  - org: Microsoft
    title: Research Scientist (Intern)
    where: Redmond, WA
    when: Summer 2020
    hosts: [Kenichi Kumatani, Dimitrios Dimitriadis]
    note: >-
      Speech and Dialog Research Group. Algorithms for training large-scale models
      robust to adversarial, Byzantine, and noisy client updates in the federated
      setting; built OpenMSFTL, an open-source federated learning platform.

  - org: Amazon
    title: Applied Scientist (AGI, Alexa AI, Alexa ML); SDE, Amazon Devices
    where: Sunnyvale, CA
    when: Summer 2016 – Spring 2019
    kind: Full Time
    note: >-
      Shipped NLP domain models shared across Alexa devices — Timers, Alarms,
      Reminders, Calendar, Communications — on Echo Show, Fire TV, and other Alexa
      IoT devices. Primary inventor on Alexa Conversations, and on online embedding
      compression for deployment-constrained NLU.

  - org: eBay Inc.
    title: Data Scientist, Customer Insights and Analytics
    where: San Jose, CA
    when: Fall 2015 – Summer 2016
    kind: Contract — Manthan Systems Inc.
    note: >-
      Deep recommendation algorithms to personalize buyer search and targeted
      advertising, including generative models for personalized emails.

  - org: Schlumberger
    title: Data Scientist
    where: Houston, TX
    when: Spring 2015 – Fall 2015
    kind: Full Time
    note: >-
      Early member of the Digital Transformation Services AI research group:
      failure prediction for deployed oil service instruments and oil level
      estimation from extraction life-cycle sensor data.

  - org: FEM Inc. (acquired by Nielsen Gracenote)
    title: Data Engineer
    where: Los Angeles, CA
    when: Winter 2015
    kind: Full Time
    note: >-
      With the co-founders: NLP models for a content recommendation system, and
      visualization tooling for an interactive analytics dashboard.

  - org: Toyota Technological Institute Chicago (TTIC)
    title: Visiting Research Scientist (Intern)
    where: Chicago, IL
    when: Summer 2014
    hosts: [David McAllester]
    note: >-
      Real-time stereo algorithm for 3D scene reconstruction for autonomous
      vehicles, plus a stereo evaluation benchmark based on a slanted-plane scene
      model; built for Toyota Research in North America (TRINA).

