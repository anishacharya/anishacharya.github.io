# Full source-authored abstracts for individual paper pages and ScholarlyArticle JSON-LD.
# Keep concise publication-list summaries in _data/papers.yml.

splice: |-
  Production LLM agents are multi-section artifacts spanning thousands of tokens, where some sections encode hard-won contracts (safety clauses, tool schemas, output formats) that must not drift, and others are legitimate optimization targets. Existing iterative prompt optimizers treat the prompt as a monolithic string, producing three recurrent failure modes: unsafe global rewrites, beam collapse onto a single lineage, and unchecked prompt bloat; none addressed by formal guarantees. This work proposes SPLICE, that frames iterative prompt optimization as combinatorial search over an edit graph of block-structured, selectively-mutable prompt states, under which a broad class of existing methods reduces to selector–proposal instances of a single batched iterative prompt search template. Within this framework we map each failure mode to a matched guarantee: (i) per-block mutability preserves contracts verbatim, with a price-of-freezing bound showing the trade-off is nearly free when frozen blocks carry small marginal gains; (ii) elitist beam search with lineage-aware diversity slots gives deterministic monotonicity, exponential no-regression tails, and conditional no-collapse, without requiring a temperature parameter; (iii) a scale-invariant ratio regularizer on prompt growth yields an explicit accuracy–length bias bound. These selectors are driven by dual section-local textual gradients, for which an edit-graph reachability result bounds the probability that an improving child arrives at a given step. We give a theoretical account of the search dynamics of iterative LLM-driven prompt optimization in which every guarantee’s assumptions are stated and its empirical check named. Empirically, across seven benchmark tasks spanning classification to LLM-as-judge alignment and a wide range of foundation models, SPLICE matches or exceeds the strongest prior method on six of seven while preserving frozen sections verbatim. Component ablations attribute the gains axis by axis, and we report the two axes that carry no measurable weight alongside those that do.

ropoll: |-
  The LLM Jury, a Panel of LLM Evaluators (POLL) (Verga et al., 2024) reporting consensus scores, has become a practical alternative to single judge LLM evaluation, yet its statistical behavior remains poorly understood. Formalizing the setup under the Huber contamination model, we show that POLL incurs unbounded bias under any positive contamination, regardless of jury size, whenever a single judge fails in a biased, LLM-typical way (mode collapse, sycophancy, safety refusal). We frame jury consensus as classical robust mean estimation and propose ROPOLL (Robust Panel of LLM-as-Judge), which preserves the POLL panel and substitutes the aggregation function with a robust mean estimator, instantiated with the geometric median (GM): tuning-free, with the optimal finite-sample breakdown point 1/2. A finite-sample error bound and an information-theoretic minimax lower bound match on the parametric rate σ√(d/N) and differ on the breakdown floor by a factor of √d, a statistical–computational gap that polynomial-time ROPOLL pays relative to the intractable Tukey halfspace median. Across 13 open-weight judges (4B–675B), three reward-model benchmarks, and four corruption regimes at rates up to 50%, ROPOLL dominates POLL on every biased corruption type: by ≈19% on cross-dimensional attacks at matched compute, and by orders of magnitude on heavy-tailed Byzantine adversaries. A 3-judge ROPOLL committee at 38B beats Mistral-Large-3 (675B) by 1.31× on HelpSteer 2 under 30% bimodal-random corruption, an 18× parameter advantage with strictly better accuracy. A Noisy-GT control confirms the premium is paid against biased contamination, not benign Gaussian imprecision (where POLL is statistically optimal).

orchopt: |-
  Multi-agent architectures are typically hand-designed, generated in one shot, or evolved through unconstrained code search. None of these treats the number of agents as a searchable parameter, and none can discover that a single agent is optimal. We argue that agent count and coordination topology deserve the same optimization discipline used for neural architectures: bounded edits, held-out validation gating, and bidirectional search that adds and removes agents without information loss. OrchOpt is a validation-gated architecture search over a unified design space in which single-agent and multi-agent configurations compete directly, with bidirectional traversal enabled by knowledge-preserving merge. A proposer model turns failure analysis into bounded merge, split, and skill edits on the current architecture, and an edit is accepted only when it strictly improves validation. Because an absorbed agent’s expertise becomes an activatable skill, merging loses no information and the search stays fully reversible at no additional inference cost. Across nine benchmarks spanning math, knowledge QA, code generation, reading comprehension, multi-hop reasoning, negotiation, and research, the optimizer simplifies to 1 agent on 4 domains and elaborates to 2–3 agents on 5 domains. It finds architectures scoring +20pp over ADAS on MGSM, +16.7pp over AFlow on HotpotQA, and +27.5pp over MARBLE’s published best topology on Bargaining, all within 7–42 candidate evaluations.

gm-matching: |-
  Data pruning – the combinatorial task of selecting a small and representative subset from a large dataset, is crucial for mitigating the enormous computational costs associated with training data-hungry modern deep learning models at scale. Since large-scale data collections are invariably noisy, developing data pruning strategies that remain robust even in the presence of corruption is critical in practice. Existing data pruning methods often fail under high corruption rates due to their reliance on empirical mean estimation, which is highly sensitive to outliers. In response, this work proposes Geometric Median (GM) Matching, a novel k-subset selection strategy that leverages the GM, a robust estimator with an optimal breakdown point of 1/2; to enhance resilience against noisy data. Our method iteratively selects a k-subset such that the mean of the subset approximates the GM of the (potentially) noisy dataset, ensuring robustness even under arbitrary corruption. We provide theoretical guarantees, showing that GM Matching enjoys an improved O(1/k) convergence rate, outperforming O(1/√k) scaling of uniform sampling, even under arbitrary corruption. Extensive experiments across image classification and image generation tasks demonstrate that GM Matching consistently outperforms existing pruning approaches, particularly in high-corruption settings; making it a strong baseline for robust data pruning.

ndsc: |-
  We consider the Distributed Source Coding (DSC) problem concerning the task of encoding an input in the absence of correlated side information that is only available to the decoder. Remarkably, Slepian and Wolf showed in 1973 that an encoder without access to the side information can asymptotically achieve the same compression rate as when the side information is available to it. This seminal result was later extended to lossy compression of distributed sources by Wyner, Ziv, Berger, and Tung. While there is vast prior work on this topic, practical DSC has been limited to synthetic datasets and specific correlation structures. Here we present a framework for lossy DSC that is agnostic to the correlation structure and can scale to high dimensions. Rather than relying on hand-crafted source modeling, our method utilizes a conditional Vector-Quantized Variational auto-encoder (VQ-VAE) to learn the distributed encoder and decoder. We evaluate our method on multiple datasets and show that our method can handle complex correlations and achieves state-of-the-art PSNR.

momentum-fl: |-
  We propose FedGLOMO, a novel federated learning (FL) algorithm with an iteration complexity of O(ε^-1.5) to converge to an ε-stationary point (i.e., E[||∇f(x)||²] ≤ ε) for smooth non-convex functions – under arbitrary client heterogeneity and compressed communication – compared to the O(ε^-2) complexity of most prior works. Our key algorithmic idea that enables achieving this improved complexity is based on the observation that the convergence in FL is hampered by two sources of high variance: (i) the global server aggregation step with multiple local updates, exacerbated by client heterogeneity, and (ii) the noise of the local client-level stochastic gradients. The first issue is particularly detrimental to FL algorithms that perform plain averaging at the server. By modeling the server aggregation step as a generalized gradient-type update, we propose a variance-reducing momentum-based global update at the server, which when applied in conjunction with variance-reduced local updates at the clients, enables FedGLOMO to enjoy an improved convergence rate. Our experiments illustrate the intrinsic variance reduction effect of FedGLOMO, which implicitly suppresses client-drift in heterogeneous data distribution settings and promotes communication efficiency.

bgmd: |-
  Geometric median (GM) is a classical method in statistics for achieving robust estimation of the uncorrupted data; under gross corruption, it achieves the optimal breakdown point of 1/2. However, its computational complexity makes it infeasible for robustifying stochastic gradient descent (SGD) in high-dimensional optimization problems. In this paper, we show that by applying GM to only a judiciously chosen block of coordinates at a time and using a memory mechanism, one can retain the breakdown point of 1/2 for smooth non-convex problems, with non-asymptotic convergence rates comparable to the SGD with GM while resulting in significant speedup in training. We further validate the run-time and robustness of our approach empirically on several popular deep learning tasks. Code available at: https://github.com/anishacharya/BGMD.

pu-contrastive: |-
  Self-supervised pretraining on unlabeled data followed by supervised finetuning on labeled data is a popular paradigm for learning from limited labeled examples. In this paper, we investigate and extend this paradigm to the classical positive unlabeled (PU) setting - the weakly supervised task of learning a binary classifier only using a few labeled positive examples and a set of unlabeled samples. We propose a novel contrastive objective - positive unlabeled Noise Contrastive Estimation (puNCE) that leverages the available explicit (from labeled samples) and implicit (from unlabeled samples) supervision to learn useful representations from positive unlabeled input data. The underlying idea is to assign each training sample an individual weight; labeled positives are given unit weight; unlabeled samples are duplicated, one copy is labeled positive and the other as negative with weights ω and (1 − ω) respectively, where ω denotes the class prior. Extensive experiments across vision and natural language tasks reveal that puNCE consistently improves over existing unsupervised and supervised contrastive baselines under limited supervision.

ldkp: |-
  Identifying keyphrases (KPs) from text documents is a fundamental task in natural language processing and information retrieval. Vast majority of the benchmark datasets for this task are from the scientific domain containing only the document title and abstract information. This limits keyphrase extraction (KPE) and keyphrase generation (KPG) algorithms to identify keyphrases from human-written summaries that are often very short (≈ 8 sentences). This presents three challenges for real-world applications: i) human-written summaries are unavailable for most documents, ii) a vast majority of the documents are long, and iii) a high percentage of KPs are directly found beyond the limited context of the title and the abstract. Therefore, we release two extensive corpora mapping KPs of ≈ 1.3M and ≈ 100K scientific articles with their fully extracted text and additional metadata including publication venue, year, author, field of study, and citations for facilitating research on this real-world problem. Additionally, we also benchmark and report the performances of different unsupervised as well as supervised algorithms for keyphrase extraction on long scientific documents. Our experiments show that formulating keyphrase extraction as a sequence tagging task with modern transformer language models capable of processing long text sequences such as longformer has advantages over the traditional algorithms, not only resulting in better performances in terms of F1 metrics but also in learning to extract optimal number of keyphrases from the input documents.

gossip: |-
  Federated learning (FL) is an emerging collaborative machine learning (ML) framework that enables training of predictive models in a distributed fashion where the communication among the participating nodes are facilitated by a central server. To deal with the communication bottleneck at the server, decentralized FL (DFL) methods advocate rely on local communication of nodes with their neighbors according to a specific communication network. In DFL, it is common algorithmic practice to have nodes interleave (local) gradient descent iterations with gossip (i.e., averaging over the network) steps. As the size of the ML models grows, the limited communication bandwidth among the nodes does not permit communication of full-precision messages; hence, it is becoming increasingly common to require that messages be lossy, compressed versions of the local parameters. The requirement of communicating compressed messages gives rise to the important question: given a fixed communication budget, what should be our communication strategy to minimize the (training) loss as much as possible? In this article, we explore this direction, and show that in such compressed DFL settings, there are benefits to having multiple gossip steps between subsequent gradient iterations, even when the cost of doing so is appropriately accounted for, e.g., by means of reducing the precision of compressed information. In particular, we show that having O(log 1/ε) gradient iterations with constant step size η and O(log 1/ε) gossip steps between every pair of these iterations enables convergence to within ε of the optimal value for a class of non-convex problems that arise in the training of deep learning models, namely, smooth non-convex objectives satisfying Polyak-Łojasiewicz condition. Empirically, we show that our proposed scheme bridges the gap between centralized gradient descent and DFL on various machine learning tasks across different network topologies and compression operators.

alexa-conversations: |-
  Traditional goal-oriented dialogue systems rely on various components such as natural language understanding, dialogue state tracking, policy learning and response generation. Training each component requires annotations which are hard to obtain for every new domain, limiting scalability of such systems. Similarly, rule-based dialogue systems require extensive writing and maintenance of rules and do not scale either. End-to-End dialogue systems, on the other hand, do not require module-specific annotations but need a large amount of data for training. To overcome these problems, in this demo, we present Alexa Conversations, a new approach for building goal-oriented dialogue systems that is scalable, extensible as well as data efficient. The components of this system are trained in a data-driven manner, but instead of collecting annotated conversations for training, we generate them using a novel dialogue simulator based on a few seed dialogues and specifications of APIs and entities provided by the developer. Our approach provides out-of-the-box support for natural conversational phenomena like entity sharing across turns or users changing their mind during conversation without requiring developers to provide any such dialogue flows. We exemplify our approach using a simple pizza ordering task and showcase its value in reducing the developer burden for creating a robust experience. Finally, we evaluate our system using a typical movie ticket booking task and show that the dialogue simulator is an essential component of the system that leads to over 50% improvement in turn-level action signature prediction accuracy.

gupshup: |-
  Code-switching is the communication phenomenon where the speakers switch between different languages during a conversation. With the widespread adoption of conversational agents and chat platforms, code-switching has become an integral part of written conversations in many multi-lingual communities worldwide. Therefore, it is essential to develop techniques for understanding and summarizing these conversations. Towards this objective, we introduce the task of abstractive summarization of Hindi-English (Hi-En) code-switched conversations. We also develop the first code-switched conversation summarization dataset - GupShup, which contains over 6,800 Hi-En conversations and their corresponding human-annotated summaries in English (En) and Hi-En. We present a detailed account of the entire data collection and annotation process. We analyze the dataset using various code-switching statistics. We train state-of-the-art abstractive summarization models and report their performances using both automated metrics and human evaluation. Our results show that multi-lingual mBART and multi-view seq2seq models obtain the best performances on this new dataset. We also conduct an extensive qualitative analysis to provide insight into the models and some of their shortcomings.

embedding-compression: |-
  Deep learning models have become state of the art for natural language processing (NLP) tasks, however deploying these models in production system poses significant memory constraints. Existing compression methods are either lossy or introduce significant latency. We propose a compression method that leverages low rank matrix factorization during training, to compress the word embedding layer which represents the size bottleneck for most NLP models. Our models are trained, compressed and then further re-trained on the downstream task to recover accuracy while maintaining the reduced size. Empirically, we show that the proposed method can achieve 90% compression with minimal impact in accuracy for sentence classification tasks, and outperforms alternative methods like fixed-point quantization or offline word embedding compression. We also analyze the inference time and storage space for our method through FLOP calculations, showing that we can compress DNN models by a configurable ratio and regain accuracy loss without introducing additional latency compared to fixed point quantization. Finally, we introduce a novel learning rate schedule, the Cyclically Annealed Learning Rate (CALR), which we empirically demonstrate to outperform other popular adaptive learning rate algorithms on a sentence classification benchmark.

butterworth: |-
  This paper proposes the design of fractional order (FO) Butterworth filter in complex w-plane (w = s^q; q being any real number) considering the presence of under-damped, hyper-damped, ultra-damped poles. This is the first attempt to design such fractional Butterworth filters in complex w-plane instead of complex s-plane, as conventionally done for integer order filters. First, the concept of fractional derivatives and w-plane stability of linear fractional order systems are discussed. Detailed mathematical formulation for the design of fractional Butterworth-like filter (FBWF) in w-plane is then presented. Simulation examples are given along with a practical example to design the FO Butterworth filter with given specifications in frequency domain to show the practicability of the proposed formulation.

lorenz-pid: |-
  Multi-wing chaotic attractors are highly complex nonlinear dynamical systems with higher number of index-2 equilibrium points. Due to the presence of several equilibrium points, randomness and hence the complexity of the state time series for these multi-wing chaotic systems is much higher than that of the conventional double-wing chaotic attractors. A real-coded genetic algorithm (GA) based global optimization framework has been adopted in this paper as a common template for designing optimum Proportional-Integral-Derivative (PID) controllers in order to control the state trajectories of four different multi-wing chaotic systems among the Lorenz family viz. Lu system, Chen system, Rucklidge (or Shimizu Morioka) system and Sprott-1 system. Robustness of the control scheme for different initial conditions of the multi-wing chaotic systems has also been shown.

bode: |-
  The PID controller parameters can be adjusted in such a manner that it gives the desired frequency response and the results are found using the Bode’s integral formula in order to adjust the slope of the Nyquist curve in a desired manner. The same idea is applied for plants with time delay. The same has also been done in a new approach. The delay term is approximated as a transfer function using Padé approximation and then the Bode integral is used to determine the controller parameters. Both the methodologies are demonstrated with MATLAB simulation of representative plants and accompanying PID controllers. A proper comparison of the two methodologies is also done. The PID controller parameters are also tuned using a real coded Genetic Algorithm (GA) and a proper comparison is done between the three methods.

multiwing: |-
  Multi-wing chaotic attractors are highly complex nonlinear dynamical systems with higher number of index-2 equilibrium points. Due to the presence of several equilibrium points, randomness of the state time series for these multi-wing chaotic systems is higher than that of the conventional double wing chaotic attractors. A real coded Genetic Algorithm (GA) based global optimization framework has been presented in this paper, to design optimum PID controllers so as to control the state trajectories of three different multi-wing Lorenz like chaotic systems viz. Lu, Rucklidge and Sprott-1 system.

fractional-q: |-
  Fractional order (FO) filters have been investigated in this paper, with band-pass (BP) and band-stop (BS) characteristics, which can not be achieved with conventional integer order filters with orders lesser then two. The quality factors for symmetric and asymmetric magnitude response have been optimized using real coded Genetic Algorithm (GA) for a user specified center frequency. Parametric influence of the FO filters on the magnitude response is also illustrated with credible numerical simulations.

nonlinear-ann: |-
  The paper investigates nonlinear system identification using system output data at various linearized operating points. A feed-forward multi-layer Artificial Neural Network (ANN) based approach is used for this purpose and tested for two target applications i.e. nuclear reactor power level monitoring and an AC servo position control system. Various configurations of ANN using different activation functions, number of hidden layers and neurons in each layer are trained and tested to find out the best configuration. The training is carried out multiple times to check for consistency and the mean and standard deviation of the root mean square errors (RMSE) are reported for each configuration.

least-square: |-
  In this paper, the classical Least Square Estimator (LSE) and its improved version the Instrumental Variable (IV) estimator have been used for the identification of an ac servo motor position control system. The data for system identification has been collected from a practical test set-up for fixed command on the final angular position of the servo motor with varying level of velocity and acceleration. The measured data is corrupted then with externally induced random noise having a Gaussian distribution, commonly known as white Gaussian noise (wGn). Performance of the LSE and IV estimators are also compared for fractional Gaussian noise (fGn) which have heavy tails in its statistical distribution and are capable of modeling real world signals having spiky nature.
